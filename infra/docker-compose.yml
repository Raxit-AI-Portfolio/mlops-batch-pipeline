services:
  fake-gcs:
    image: fsouza/fake-gcs-server:1.47.4
    container_name: gcs_emulator
    ports:  ["4443:4443"]
    command: ["-scheme", "http", "-public-host", "fake-gcs"]
    volumes:
      # Bind mount (host path)
      - fake-gcs-data:/data
    networks: [act-network]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mlflow
    ports: ["5000:5000"]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlruns
    volumes: [mlflow-data:/mlruns]
    networks: [act-network]
  registry:
    image: registry:2
    container_name: docker_image_registry
    ports: ["5001:5000"]
    volumes: [registry-data:/var/lib/registry]
    networks: [act-network]
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: app
    ports: ["8000:8000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on: [mlflow]
    networks: [act-network]
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    volumes: ["${PROM_CONFIG:-../monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    depends_on: [app]
    networks: [act-network]
  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports: ["3000:3000"]
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [prometheus]
    networks: [act-network]
  airflow-db:
    image: postgres:16
    container_name: airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    networks: [act-network]
  airflow-init:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: airflow_init
    depends_on: [airflow-db]
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      MLFLOW_TRACKING_URI: http://mlflow:5000
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username "$${AIRFLOW_ADMIN_USER:-admin}" --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}" --firstname admin --lastname admin --role Admin --email admin@example.com
    volumes:
      - ..:/opt/project
      - airflow-logs:/opt/airflow/logs
    networks: [act-network]
  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: airflow_webserver
    depends_on: [airflow-init, mlflow]
    environment: *airflow-env
    command: webserver
    ports: ["8080:8080"]
    volumes:
      - ..:/opt/project
      - ../orchestration/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    networks: [act-network]
  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    container_name: airflow_scheduler
    depends_on: [airflow-init, mlflow]
    environment: *airflow-env
    command: scheduler
    volumes:
      - ..:/opt/project
      - ../orchestration/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    networks: [act-network]
# Named volumes (persistent storage)
volumes:
  fake-gcs-data:
    driver: local
  mlflow-data:
    driver: local
  registry-data:
    driver: local
  app-data:
    driver: local
  redis-data:
    driver: local
  airflow-db-data:
    driver: local
  airflow-logs:
    driver: local
# Custom networks
networks:
  act-network:
    driver: bridge
    name: act-network